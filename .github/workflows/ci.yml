name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for API health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4000/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "bridge-server did not become healthy in time"
          docker compose ps
          exit 1
      - name: Wait for web health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8080/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "bridge-web did not become reachable in time"
          docker compose ps
          exit 1
      - name: Run Docker smoke assertions
        run: |
          HEALTH_JSON="$(curl -fsS "http://127.0.0.1:4000/health")"
          echo "$HEALTH_JSON" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          echo "$HEALTH_JSON" | grep -Eq '"analyticsEnabled"[[:space:]]*:[[:space:]]*false'
          echo "$HEALTH_JSON" | grep -Eq '"commitSha"[[:space:]]*:'

          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR"' EXIT
          curl -fsS -c "$COOKIE_JAR" \
            -H "Content-Type: application/json" \
            -d '{"email":"alex@bridge.local","password":"bridge123!"}' \
            "http://127.0.0.1:4000/auth/login" >/dev/null

          BOOTSTRAP_JSON="$(curl -fsS -b "$COOKIE_JAR" "http://127.0.0.1:4000/bootstrap")"
          echo "$BOOTSTRAP_JSON" | grep -Eq '"channels"[[:space:]]*:'
          echo "$BOOTSTRAP_JSON" | grep -Eq '"messages"[[:space:]]*:'
      - name: Tear down stack
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-build, smoke, docker-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image metadata
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REGISTRY="ghcr.io/${OWNER_LC}"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-12)"

          SERVER_TAGS="${REGISTRY}/bridge-server:sha-${SHORT_SHA}"
          WEB_TAGS="${REGISTRY}/bridge-web:sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            SERVER_TAGS+="${SERVER_TAGS:+,}${REGISTRY}/bridge-server:latest"
            WEB_TAGS+="${WEB_TAGS:+,}${REGISTRY}/bridge-web:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            SERVER_TAGS+="${SERVER_TAGS:+,}${REGISTRY}/bridge-server:${VERSION_TAG}"
            WEB_TAGS+="${WEB_TAGS:+,}${REGISTRY}/bridge-web:${VERSION_TAG}"
            SERVER_TAGS+="${SERVER_TAGS:+,}${REGISTRY}/bridge-server:latest"
            WEB_TAGS+="${WEB_TAGS:+,}${REGISTRY}/bridge-web:latest"
          fi

          echo "server_tags=${SERVER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "web_tags=${WEB_TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bridge-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.server_tags }}
      - name: Build and push bridge-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.example.com' }}
            VITE_WS_URL=${{ vars.VITE_WS_URL || 'wss://api.example.com' }}
